# XcodeGen spec for the app. Generate the project with:  Tools/generate.sh
name: aOS
options:
  bundleIdPrefix: dev.marquart
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  AOSKit:
    path: AOSKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    DEVELOPMENT_TEAM: S3725YB7V6
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 15
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Release:
      # No get-task-allow in what users get (Xcode adds it to builds that aren't exported from an archive).
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targets:
  aOS:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes:
          - "AppIcon.icon"
      - path: App/Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: App/LaunchAgents/dev.marquart.aos.session.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
      # The privileged helper (SMAppService.daemon): sleep with the lid closed and Wi-Fi settings
      - path: App/LaunchDaemons/dev.marquart.aos.powerd.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: AOSKit
        product: AOSKit
      - package: SwiftTerm
      - package: Sparkle
      - target: aos-mcp
        embed: true
        codeSign: true
        copy:
          destination: executables
      - target: aos-session
        embed: true
        codeSign: true
        copy:
          destination: executables
      - target: aos-companion
        embed: true
        codeSign: true
        copy:
          destination: executables
      - target: aos-powerd
        embed: true
        codeSign: true
        copy:
          destination: executables
      # aOS's Tailscale node (Go, Tailnet/), built and signed by the aggregate target below, copied in after the build
      - target: aos-tailnet
      # Runs inside the workspace; the app hands it to the guest (GuestKit.helperArchive)
      - target: AOSHelper
        embed: true
        codeSign: true
        copy:
          destination: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: aOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "27.0"
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.marquart.aos
            CFBundleURLSchemes: [aos]
        NSLocalNetworkUsageDescription: "aOS connects to its workspace, a virtual Mac that macOS counts as a device on your local network, and lets your iPhone find this Mac when you pair it. Nothing else on your network is contacted."
        NSBonjourServices:
          - _aos-pair._tcp
        NSHumanReadableCopyright: "© 2026 Maximilian Marquart"
        SUFeedURL: https://mr-mandelbrot.github.io/aos/appcast.xml
        SUPublicEDKey: REPLACE_WITH_SPARKLE_PUBLIC_KEY
        SUEnableInstallerLauncherService: false
    postBuildScripts:
      # aos-powerd starts it as the hidden user _aostailnet (Docs/DESIGN.md, "Reaching the Mac on the go")
      - name: Copy aos-tailnet
        # A new file every time (the script sandbox lets it write only this path; no temporary file beside it)
        script: rm -f "$SCRIPT_OUTPUT_FILE_0" && cp "$SCRIPT_INPUT_FILE_0" "$SCRIPT_OUTPUT_FILE_0"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/aos-tailnet
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/aos-tailnet
    entitlements:
      path: App/aOS.entitlements
      properties:
        com.apple.security.virtualization: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.marquart.aos
        PRODUCT_NAME: aOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES

  aos-mcp:
    type: tool
    platform: macOS
    sources:
      - path: AOSKit/Sources/aos-mcp
    dependencies:
      - package: AOSKit
        product: AOSKit
    settings:
      base:
        PRODUCT_NAME: aos-mcp
        PRODUCT_BUNDLE_IDENTIFIER: dev.marquart.aos.mcp
        SKIP_INSTALL: YES

  aos-session:
    type: tool
    platform: macOS
    sources:
      - path: AOSKit/Sources/aos-session
    dependencies:
      - package: AOSKit
        product: AOSKit
    settings:
      base:
        PRODUCT_NAME: aos-session
        PRODUCT_BUNDLE_IDENTIFIER: dev.marquart.aos.session
        SKIP_INSTALL: YES

  aos-companion:
    type: tool
    platform: macOS
    sources:
      - path: AOSKit/Sources/aos-companion
    dependencies:
      - package: AOSKit
        product: AOSKit
    settings:
      base:
        PRODUCT_NAME: aos-companion
        PRODUCT_BUNDLE_IDENTIFIER: dev.marquart.aos.companion
        SKIP_INSTALL: YES

  # The privileged helper: a root LaunchDaemon from Contents/Library/LaunchDaemons (SMAppService.daemon). It accepts
  # only aOS itself (code signature); see AOSKit/Sources/aos-powerd.
  aos-powerd:
    type: tool
    platform: macOS
    sources:
      - path: AOSKit/Sources/aos-powerd
    dependencies:
      - package: AOSKit
        product: AOSKit
    settings:
      base:
        PRODUCT_NAME: aos-powerd
        PRODUCT_BUNDLE_IDENTIFIER: dev.marquart.aos.powerd
        SKIP_INSTALL: YES

  # The helper inside the workspace: a background app with the Accessibility permission (see GuestHelper.swift)
  AOSHelper:
    type: application
    platform: macOS
    sources:
      - path: AOSKit/Sources/aos-guest-helper
      - path: App/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    info:
      path: Helper/Info.plist
      properties:
        CFBundleDisplayName: aOS Helper
        CFBundleName: aOS Helper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSBackgroundOnly: true
        LSUIElement: true
        LSMinimumSystemVersion: "27.0"
        NSHumanReadableCopyright: "© 2026 Maximilian Marquart"
    settings:
      base:
        PRODUCT_NAME: AOSHelper
        PRODUCT_BUNDLE_IDENTIFIER: dev.marquart.aos.guest-helper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES

# aOS's Tailscale node for the Mac (Go, tailscale.com/tsnet): Tools/build-tailnet.sh runs Tailnet/build.sh mac and
# signs the result with the app's identity and the hardened runtime. Go reads its module cache and toolchain, which a
# sandboxed script may not, so this step alone runs without the script sandbox.
aggregateTargets:
  aos-tailnet:
    buildScripts:
      - name: Build aos-tailnet
        script: exec "$SRCROOT/Tools/build-tailnet.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Aggregate targets don't sign by default; the script signs aos-tailnet unless the build turns signing off.
        CODE_SIGNING_ALLOWED: YES
