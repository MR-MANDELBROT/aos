# The Mac this is built on has 16 GB and is often under memory pressure: one modest daemon, no parallel work, the
# Kotlin compiler inside it (no separate Kotlin daemon).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
